name: build

on:
  pull_request:

permissions:
  contents: read

# The release workflow repeats these checks before deploying every main commit.
# Keep this workflow focused on PR validation to avoid rebuilding after merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Validate EmDash content seed
        run: node node_modules/emdash/dist/cli/index.mjs seed seed/blog.json --validate
      - name: Build EmDash Worker
        run: npm run build:blog
