name: Deploy release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lumi-local-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy release to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          npx --no-install wrangler pages deploy dist --project-name lumi-local --branch main --commit-hash "$(git rev-parse HEAD)" --commit-dirty=false
      - name: Verify live pages
        run: |
          curl --fail --retry 5 --retry-delay 3 https://lumi-local.pages.dev/ -o /tmp/lumi-vi.html
          curl --fail --retry 5 --retry-delay 3 https://lumi-local.pages.dev/en/ -o /tmp/lumi-en.html
          grep -q 'Lumi Local' /tmp/lumi-vi.html
          grep -q 'Lumi Local' /tmp/lumi-en.html
