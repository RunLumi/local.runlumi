name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumi-local-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Validate EmDash content seed
        run: node node_modules/emdash/dist/cli/index.mjs seed seed/blog.json --validate
      - name: Build EmDash Worker
        run: npm run build:blog
      - name: Deploy main to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          npx --no-install wrangler pages deploy dist --project-name lumi-local --branch main --commit-hash "$(git rev-parse HEAD)" --commit-dirty=false
      - name: Verify live pages
        run: |
          curl --fail --retry 5 --retry-delay 3 https://local.runlumi.app/ -o /tmp/lumi-vi.html
          curl --fail --retry 5 --retry-delay 3 https://local.runlumi.app/en/ -o /tmp/lumi-en.html
          grep -q 'Lumi Local' /tmp/lumi-vi.html
          grep -q 'Lumi Local' /tmp/lumi-en.html
          node scripts/verify-release.mjs
